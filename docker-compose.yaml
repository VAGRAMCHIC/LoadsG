version: "3.9"

services:
  loadsg:
    build: .
    container_name: loader
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      PG_CONN: "postgres://testuser:testpassword@db:5432/loadsg"
      MAX_CONCURRENT: 10
      JWT_KEY: OoGael1eiVeighoo3eighoh9ze8mewosvveER
      APP_NAME: load_gen
      JWT_REFRESH_KEY: sdacsfwfwewuikuntgmyu674y3ervbnmyu5cscsdvfgrtyyk676623
      ROOT_TOKEN: a12345678
      ROOT_USER: root
    networks:
      - loadsg-network
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: postgres17
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: loadsg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - loadsg-network

    restart: unless-stopped

networks:
  loadsg-network:
    driver: bridge

volumes:
  postgres_data:
